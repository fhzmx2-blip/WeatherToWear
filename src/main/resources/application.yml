spring:
  application:
    name: WeatherToWear
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8090
mybatis:
  mapper-locations: classpath:mapper/*.xml
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000